[project]
name = "creditscoring-churn"
version = "0.1.0"
description = "End-to-end bank churn classification: notebooks + Streamlit UI"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.30",
    "joblib>=1.3",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
